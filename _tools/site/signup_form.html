<form class="signal-sub" data-placement="{placement}" action="https://thesignalhr.substack.com/api/v1/free?nojs=true" method="post" target="_blank" rel="noopener">
  <input type="hidden" name="source" value="embed">
  <label for="{id}">Get the weekly signal by email</label>
  <div class="signal-sub-row"><input id="{id}" type="email" name="email" placeholder="you@company.com" autocomplete="email" required><button type="submit">Subscribe</button></div>
  <small>Free. Substack sends the newsletter and opens in a new tab to confirm. Unsubscribe anytime.</small>
</form>
